// Config inspired by ProximaCentauriStar's configs for Cosmic Serenity (https://forum.kerbalspaceprogram.com/topic/228453-112x-cosmic-serenity-v312/ Following CC BY-NC-ND 4.0)
// which are themselves inspired by JasonKerman's configs for Kcalbeloh (https://forum.kerbalspaceprogram.com/topic/203753-1125-kcalbeloh-system-planet-pack-v118-a-journey-to-a-black-hole-aug-31-2024/ Following CC BY-NC-ND 4.0)
// its all copies of copies, all the way down...


@Kopernicus:FOR[hSystems]:HAS[@hS_Settings:HAS[#Wormholes[?rue]]]:NEEDS[KopernicusExpansion]
{
	Body
	{
		name = WH-UMLW-A
		cacheFile = hSystems/_Systems/Uung/Cache/WH-UMLW-A.bin
		Tag = hS_Wormhole
		Template
		{
			name = Minmus
			removeAllPQSMods = true
		}
		Properties
		{
			displayName = WH-UMLW-A^N
			description = This object seems to be a shortcut to another world. Shall we go diving?
			radius = 10000
			geeASL = 8
			isHomeWorld = false
			tidallyLocked = false
			rotationPeriod = 50000
			maxZoom = 60000
			Biomes
			{
				Biome
				{
					name = Wormhole
					displayName = Wormhole
					value = 0
					color = #000000
				}
			}
		}
		Wormhole
		{
			partner = WH-UMLW-B
			influenceAltitude = 35000
			jumpMaxAltitude = 30000
			jumpMinAltitude = 10
			entryMessage = Entering Wormhole
			exitMessage = Exiting Wormhole
			entryMsgDuration = 20
			exitMsgDuration = 10
			heatRate = 0.01
		}
		ScaledVersion
		{
			type = Vacuum
			fadeStart = 7000
			fadeEnd = 10000
			OnDemand
			{	
				texture = hSystems/_Core/Textures/PluginData/black.dds
				normals = hSystems/_Core/Textures/PluginData/generic_normal.dds
			}
			Material
			{
				color = 1,1,1,1
				specColor = 0.05,0.05,0.05,1
				shininess = 1
			}
		}
		Orbit
		{
			referenceBody = Sun
			inclination = 1
			eccentricity = 0.02
			semiMajorAxis = 68773560000
			longitudeOfAscendingNode = 52
			argumentOfPeriapsis = 300
			meanAnomalyAtEpoch = 0.1
			epoch = 0
			color = 0.2,0.2,0.2,0.2
			iconTexture = hSystems/Misc/Icons/Wormhole.png
		}
		PQS
		{
			Mods
			{			
				VertexHeightMap
				{
					map = hSystems/_Core/Textures/PluginData/black.dds
					offset = -9999
					deformity = 0
					scaleDeformityByRadius = False
					order = 10
					enabled = True
				}
				VertexColorMap
				{
					map = hSystems/_Core/Textures/PluginData/black.dds
					order = 90
					enabled = True
					name = VertexColorMap
					index = 0
				} 
			}
		}
	}
}

@Kopernicus:AFTER[OPM]
{
	@Body[WH-UMLW-A]
	{
		@Orbit
		{
			%referenceBody = Urlum
			%semiMajorAxis = 25727895
			%relativeToParent = True
		}
	}
}