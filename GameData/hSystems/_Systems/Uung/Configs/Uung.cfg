		{
			displayName = Uung^N
			description = Uung is a sun-like star in its death throes. Having exited the asymptotic giant branch, leaving the "red giant" phase for good, it is in its final moments. It has contracted by a factor of nearly one hundred relative to its size on the red giant branch, and has heated up to tens of thousands of degrees. It is so hot that to a close-up observer, it shines an almost 'actinic' violet. It is losing mass at an absurdly fast rate, driven by stellar winds so intense they can be seen with ease even without the aid of a coronagraph, and is expected to complete the transition to a degenerate white dwarf in less than thirty thousand years.\The intense mass loss Uung has experienced over the past tens of thousands of years has created a massive planetary nebula around it. The high surface temperature has ionised this nebula, causing it to glow beautifully.\Uung still hosts a system of battered and burnt planets, which it continues to blast with intense heat to this day. After Uung becomes a white dwarf, these planets will cool, and will likely become significantly less interesting for the foreseeable future.\We are lucky to possess the opportunity to study a star like Uung, and its planetary nebula will continue to be a beautiful sight in the night sky for millenia to come. We should visit it while we still have the chance.
